[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "AlphaForge: Qlib-native factor mining, evaluation, portfolio construction and T0 event-cross-section research platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AlphaForge" }]
dependencies = [
  "pyqlib>=0.9.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
  "plotly>=5.18",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "tushare>=1.2",
  "fastapi>=0.100",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
alphaforge = "alphaforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alphaforge = ["report/*.html", "web/static/*", "web/static/vendor/*", "expr/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
