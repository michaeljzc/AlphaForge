# AlphaForge 默认配置
project:
  name: AlphaForge
  tagline: 基于 Microsoft Qlib 的因子挖掘 / 回测 / 组合构建平台（T0 事件截面扩展）

paths:
  data: data
  market_db: data/market.db
  qlib_dir: data/qlib_cn
  cache: data/cache
  factors: artifacts/factors
  reports: reports

data:
  start: "2019-01-01"
  end: "2026-10-30"
  # 股票池 = 以下指数历史成分并集（规避幸存者偏差）；可加入 000852.SH
  universe_indices: ["000300.SH", "000905.SH"]
  benchmark: "000300.SH"
  tushare_token_env: TUSHARE_TOKEN
  # Tushare 凭据回退路径（不存在则忽略）
  tushare_token_files:
    - "config/credentials.json"
    - "~/Quant/qQuant/quantlab/config/credentials.json"
  min_list_days: 60          # 上市满 N 个交易日才进入股票池
  exclude_st: true           # 股票池默认剔除 ST
  min_price: 1.0             # 剔除低价股（可交易性过滤）
  min_amount: 5000000.0      # 日成交额下限（元）

evaluation:
  horizons: [1, 5, 10, 20, 60]
  primary_horizon: 5
  min_ic: 0.03
  min_icir: 0.5
  min_positive_rate: 0.55
  quantiles: 5
  cost_bps: 30               # 双边成本压力测试（3.0%）
  min_names_per_date: 30
  ic_decay: true

preprocess:
  winsorize: mad             # mad | sigma | none
  mad_k: 3.0
  standardize: zscore
  neutralize: [industry, size]
  industry_field: industry
  size_field: log_mv

backtest:
  initial_cash: 10000000
  commission_bps: 3          # 佣金万三，双边
  stamp_duty_bps: 5          # 印花税万五，仅卖出
  slippage_bps: 5            # 滑点万五
  max_participation: 0.10    # 单票单日不超过成交额 10%
  lot_size: 100
  t_plus_one: true
  execution: next_open       # next_open | next_vwap
  max_positions: 50
  max_weight: 0.05
  benchmark: "000300.SH"

event:
  lookback: 250
  label_window: 60
  # 启动事件定义
  volume_ratio_min: 2.5      # 当日量 / 过去 20 日均量
  pct_chg_min: 0.03          # 当日涨幅
  turnover_pct_min: 0.80     # 换手率历史分位
  close_above_ma20: true
  min_amount: 5000.0         # 千元
  exclude_open_limit_up: true
  # 标签分级（区间最大涨幅 / 最大回撤）
  strong_return: 2.00
  weak_return: 0.60
  strong_max_drawdown: 0.50
  # 事件评估
  cross_section_days: 20     # 事件截面聚合窗口（交易日）
  min_events_per_section: 5

mining:
  gp:
    population: 200
    generations: 15
    tournaments: 3
    crossover_rate: 0.6
    mutation_rate: 0.3
    max_depth: 4
    max_nodes: 28
    parsimony: 0.0005
    fitness_sample_dates: 120
    fitness_sample_symbols: 300
    hall_of_fame: 30
    seed: 42
    train_start: "2021-01-01"
    train_end: "2023-12-31"
    valid_start: "2024-01-01"
    valid_end: "2024-12-31"
    test_start: "2025-01-01"
    test_end: "2026-10-30"
  redundancy_max_corr: 0.70

portfolio:
  combine: ic_weighted        # equal | ic_weighted | lgbm
  top_n: 50
  buffer: 10                  # 排名缓冲，降低换手
  industry_neutral: true
  size_neutral: true
  max_industry_dev: 0.05
  turnover_penalty: 0.2

risk:
  cov: shrinkage
  shrinkage: 0.1
  lookback: 120
